name: Native ESP-IDF targets

on:
  push:
    branches: [feature/esp-idf-modern, feature/esp-idf-s3, feature/esp-idf-s3-bringup, feature/esp-idf-p4, feature/esp-idf-u213, feature/esp-idf-u213-ota]
    paths:
      - 'firmware/esp-idf/**'
      - 'firmware/esp-idf-bringup/**'
      - '.github/workflows/esp-idf.yml'
  pull_request:
    paths:
      - 'firmware/esp-idf/**'
      - 'firmware/esp-idf-bringup/**'
      - '.github/workflows/esp-idf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32s3, esp32p4]
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.6
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify SDK and build without credentials
        shell: bash
        working-directory: firmware/esp-idf
        run: |
          . "$IDF_PATH/export.sh"
          test "$(git -C "$IDF_PATH" rev-parse HEAD)" = "880a203ae603d08a94d06aa01e0d6761958e5e9e"
          idf.py --version
          idf.py -B build-${{ matrix.target }} set-target ${{ matrix.target }}
          idf.py -B build-${{ matrix.target }} build
          idf.py -B build-${{ matrix.target }} size
  protocol-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check register vectors, pin policies and HAL fake-driver failures
        run: bash firmware/esp-idf/tests/run_host_tests.sh
      - name: Check standalone console parsing, clock provenance and metadata
        run: bash firmware/esp-idf-bringup/tests/run_host_tests.sh
      - name: Check Linux OTA uploader
        run: python3 firmware/esp-idf-bringup/tests/test_ota_uploader.py
  standalone-bringup:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: s3, target: esp32s3, image: splitflap_s3_bringup, defaults: sdkconfig.defaults}
          - {profile: p4-v3, target: esp32p4, image: splitflap_p4_bringup, defaults: sdkconfig.defaults}
          - profile: p4-early
            target: esp32p4
            image: splitflap_p4_bringup
            defaults: 'sdkconfig.defaults;sdkconfig.p4-early'
          - profile: p4-v3-ethernet
            target: esp32p4
            image: splitflap_p4_bringup
            defaults: 'sdkconfig.defaults;tests/sdkconfig.p4-ethernet-compile'
          - profile: p4-early-ethernet-uart0
            target: esp32p4
            image: splitflap_p4_bringup
            defaults: 'sdkconfig.defaults;sdkconfig.p4-early;sdkconfig.p4-uart0;tests/sdkconfig.p4-ethernet-compile'
          - profile: p4-u213-early
            target: esp32p4
            image: splitflap_p4_bringup
            defaults: 'sdkconfig.defaults;sdkconfig.p4-early;sdkconfig.p4-u213'
          - profile: p4-u213-ota
            target: esp32p4
            image: splitflap_p4_bringup
            defaults: 'sdkconfig.defaults;sdkconfig.p4-early;sdkconfig.p4-u213;sdkconfig.p4-u213-ota'
          - profile: p4-u213-ota-fail
            target: esp32p4
            image: splitflap_p4_bringup
            defaults: 'sdkconfig.defaults;sdkconfig.p4-early;sdkconfig.p4-u213;sdkconfig.p4-u213-ota;tests/sdkconfig.p4-u213-ota-fail'
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.6
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and verify standalone diagnostic profile
        shell: bash
        working-directory: firmware/esp-idf-bringup
        env:
          PROFILE: ${{ matrix.profile }}
          TARGET: ${{ matrix.target }}
          IMAGE: ${{ matrix.image }}
          DEFAULTS: ${{ matrix.defaults }}
        run: |
          . "$IDF_PATH/export.sh"
          test "$(git -C "$IDF_PATH" rev-parse HEAD)" = "880a203ae603d08a94d06aa01e0d6761958e5e9e"
          build="build-$PROFILE"
          idf.py -B "$build" -D "IDF_TARGET=$TARGET" -D "SDKCONFIG_DEFAULTS=$DEFAULTS" build
          sha256sum "$build/$IMAGE.bin" "$build/$IMAGE.elf" \
            "$build/esp-idf/main/generated/build_metadata.hpp" > "$build/before.sha256"
          idf.py -B "$build" size
          idf.py -B "$build" build
          sha256sum "$build/$IMAGE.bin" "$build/$IMAGE.elf" \
            "$build/esp-idf/main/generated/build_metadata.hpp" > "$build/after.sha256"
          diff "$build/before.sha256" "$build/after.sha256"
          python tests/check_isolation.py "$build" "$PROFILE"
      - name: Package P4 flash files
        if: matrix.profile == 'p4-v3' || matrix.profile == 'p4-early' || matrix.profile == 'p4-u213-early' || matrix.profile == 'p4-u213-ota'
        shell: bash
        working-directory: firmware/esp-idf-bringup
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          cd "build-$PROFILE"
          mkdir -p flash-package/bootloader flash-package/partition_table
          cp flash_args splitflap_p4_bringup.bin flash-package/
          cp bootloader/bootloader.bin flash-package/bootloader/
          cp partition_table/partition-table.bin flash-package/partition_table/
          if [[ "$PROFILE" == p4-u213-ota ]]; then
            cp ota_data_initial.bin flash-package/
          fi
          cd flash-package
          files=(flash_args bootloader/bootloader.bin partition_table/partition-table.bin splitflap_p4_bringup.bin)
          if [[ "$PROFILE" == p4-u213-ota ]]; then
            files+=(ota_data_initial.bin)
          fi
          sha256sum "${files[@]}" > SHA256SUMS
      - name: Upload P4 flash package
        if: matrix.profile == 'p4-v3' || matrix.profile == 'p4-early' || matrix.profile == 'p4-u213-early' || matrix.profile == 'p4-u213-ota'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: splitflap-${{ matrix.profile }}-usb-serial-jtag
          path: firmware/esp-idf-bringup/build-${{ matrix.profile }}/flash-package/
          if-no-files-found: error
      - name: Upload app-only U213 OTA image
        if: matrix.profile == 'p4-u213-ota' || matrix.profile == 'p4-u213-ota-fail'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: splitflap-${{ matrix.profile }}-app-only
          path: firmware/esp-idf-bringup/build-${{ matrix.profile }}/splitflap_p4_bringup.bin
          if-no-files-found: error
